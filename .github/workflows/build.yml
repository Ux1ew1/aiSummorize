name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write # нужно только для публикации релиза по тегу

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-cpu
            os: windows-latest
            bundles: nsis
            tauri_args: ""
            bundle_glob: src-tauri/target/release/bundle/nsis/*.exe
          - name: windows-cuda
            # CUDA 12.x интегрируется в Visual Studio 2022; на windows-latest уже VS 2026 ("No CUDA toolset found")
            os: windows-2022
            bundles: nsis
            tauri_args: "-- --features cuda"
            cuda: true
            bundle_glob: src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-intel
            os: macos-15-intel # Intel-раннер (x86_64)
            bundles: dmg
            tauri_args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            bundle_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # libclang для bindgen (на раннерах Windows LLVM уже установлен)
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install CUDA Toolkit
        if: matrix.cuda == true
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.2"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      # Генератор Visual Studio не находит CUDA toolset ("No CUDA toolset found"),
      # поэтому собираем llama.cpp через Ninja: ему нужны только nvcc и cl.exe в PATH.
      - name: MSVC environment (for Ninja + nvcc)
        if: matrix.cuda == true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use Ninja CMake generator
        if: matrix.cuda == true
        shell: pwsh
        run: echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restrict CUDA architectures (shorter build)
        if: matrix.cuda == true
        shell: pwsh
        run: echo "CUDAARCHS=75-real;86-real;89-real;89-virtual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci

      - name: Build installer
        if: runner.os != 'macOS'
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}

      # hdiutil на раннерах macOS иногда не может размонтировать образ ("Resource busy") —
      # повторяем упаковку (компиляция при повторе берётся из кэша cargo).
      - name: Build installer (macOS, with retries)
        if: runner.os == 'macOS'
        run: |
          for attempt in 1 2 3; do
            if npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}; then
              exit 0
            fi
            echo "Build attempt $attempt failed, cleaning up mounted images and retrying..."
            for d in $(hdiutil info | grep -o '/dev/disk[0-9]*' | sort -u); do
              hdiutil detach "$d" -force || true
            done
            sleep 15
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ai-summorise-${{ matrix.name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundle_glob }}
