[package]
name = "ai-summorise"
version = "0.1.0"
description = "Local summarizer and translator powered by llama.cpp"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_summorise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
llama-cpp-2 = { version = "0.1.161", default-features = false }
enigo = "0.6"
arboard = "3"

# Metal на macOS (в т.ч. Intel с дискретной/встроенной GPU)
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }

[features]
default = []
# Сборка с CUDA (нужен CUDA Toolkit 12.x при компиляции): `npm run build:cuda`
cuda = ["llama-cpp-2/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
